slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Solver Plugin
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS / Coordinate Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Tuning Parameters
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 # 50hz
    map_update_interval: 0.5       # 2 Hz map updates for responsive live visualization
    resolution: 0.05               # 5 cm occupancy grid cell resolution
    max_laser_range: 16.0          # Match full LiDAR sensor range (16m)
    min_laser_range: 0.12          # Exclude chassis self-reflection
    minimum_time_interval: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    scan_queue_size: 10
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Motion Thresholds (Responsive graph node insertion during teleop)
    minimum_travel_distance: 0.15  # Add node every 15cm for smooth continuous mapping
    minimum_travel_heading: 0.15   # Add node every ~8.5 degrees of turn

    # Scan Matching & Buffer
    scan_buffer_size: 25
    scan_buffer_maximum_scan_distance: 16.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Loop Closure Optimization
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 8.0
